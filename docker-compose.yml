services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezstore
      POSTGRES_PASSWORD: ezstore
      POSTGRES_DB: ezstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cshliu77/ezstore/backend:latest
    pull_policy: always
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ezstore
      DB_PASSWORD: ezstore
      DB_NAME: ezstore
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  mcp-server:
    image: ghcr.io/cshliu77/ezstore/mcp-server:latest
    pull_policy: always
    environment:
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      # 讓本機執行的 Agent（agents-cli playground / run / eval）也能連到 MCP Server
      - "${MCP_HOST_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started


  agent:
    image: ghcr.io/cshliu77/ezstore/agent:latest
    pull_policy: always
    environment:
      MCP_URL: http://mcp-server:8000/mcp
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.1-flash-lite}
      # Base URL advertised on the A2A agent cards. Inside this container the
      # quotation -> order handoff calls http://localhost:8080/a2a/order_agent.
      A2A_BASE_URL: ${A2A_BASE_URL:-http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-http://localhost:3000}
      # Order agent (read-only second app); defaults match spec section 2.4.
      ORDER_AGENT_MAX_ATTEMPTS: ${ORDER_AGENT_MAX_ATTEMPTS:-3}
      ORDER_AGENT_LLM_TIMEOUT_MS: ${ORDER_AGENT_LLM_TIMEOUT_MS:-10000}
      ORDER_AGENT_MAX_LLM_CALLS: ${ORDER_AGENT_MAX_LLM_CALLS:-50}
      ORDER_AGENT_FAKE_LLM: ${ORDER_AGENT_FAKE_LLM:-}
    expose:
      # Internal only: the frontend nginx proxies /agent-api/ to agent:8080.
      - "8080"
    depends_on:
      mcp-server:
        condition: service_started

  frontend:
    image: ghcr.io/cshliu77/ezstore/frontend:latest
    pull_policy: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - mcp-server
      - agent

  e2e:
    image: ghcr.io/cshliu77/ezstore/e2e:latest
    pull_policy: always
    environment:
      BASE_URL: http://frontend:80
      API_URL: http://backend:8080
    depends_on:
      - frontend
    profiles:
      - test

volumes:
  pgdata:
